<style>

  /* ---------- pulsante "torna alla copertina" ---------- */

    cursor: pointer;

  /* ---------- etichette sopra i menu ---------- */

  .menu-label{
    text-align:center;
    font-family:'Work Sans', sans-serif;
    font-size: 0.78rem;
    color: #8a83a0;
    margin: 0 0 12px;

  /* ---------- i due menu ---------- */

    display:flex;
    flex-wrap: wrap;
    justify-content:center;
    gap: 10px;
    max-width: 640px;
    margin: 0 auto 30px;
  }

  .menu button{
    font-family:'Work Sans', sans-serif;
    font-size: 1rem;
    border: 1px solid var(--ink-edge);
    background: transparent;
    color: var(--gold);
    cursor: pointer;
    transition: background 0.2s, color 0.2s, transform 0.2s;
  }

  .menu button:hover{ transform: translateY(-2px); }

  .menu button.active{
    background: var(--gold);
    color: var(--ink);
    border-color: var(--gold);
  }

  /* pulsanti pianeti: cerchi */
  #menuPianeti button{
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 1.05rem;
  }

  /* pulsanti aspetti: pillole rettangolari, più larghe */
  #menuAspetti button{
    height: 40px;
    padding: 0 14px;
    border-radius: 20px;
    font-size: 0.92rem;
  }

  .menu-aspetti-wrap{
    margin-bottom: 44px;
  }

  /* ---------- lo stage con la carta ---------- */

  .stage{
    display:flex;
    justify-content:center;
  }

  .card-slot{
    width: 300px;
    max-width: 82vw;
    aspect-ratio: 5 / 7.6;
    perspective: 1800px;
    cursor: pointer;
  }

  .card{
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(.22,.68,.2,1.02);
  }

  .card-slot.flipped .card{
    transform: rotateY(180deg);
  }

  .face{
    position:absolute;
    inset:0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 6px;
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 28px;
    box-shadow: 0 18px 40px -12px rgba(0,0,0,0.6);
  }

  .face-front{
    background: linear-gradient(160deg, #1d1a2c 0%, var(--ink) 65%);
    border: 1px solid var(--ink-edge);
  }

  .face-back{
    background: var(--parchment);
    color: var(--plum-text);
    transform: rotateY(180deg);
    align-items:flex-start;
    text-align:left;
  }

  .front-glyphs{
    font-size: 2.2rem;
    color: var(--gold);
    margin-bottom: 18px;
  }

  .front-title{
    font-family:'Adam';
    font-size: 1.2rem;
    color: #f4efe0;
    margin: 0 0 14px;
  }

  .front-teaser{

    font-size: 0.92rem;
    color: #b8b2c9;
    margin: 0;

  .front-hint{
    position:absolute;
    bottom: 18px;
    font-size: 0.7rem;
    color: rgba(195,161,90,0.5);
  }

  .back-eyebrow{

    content:'';
    position:absolute;
    left:0; top:0.5em;
    width:5px; height:5px;
    border-radius:50%;

      glyph: "☊ ☌ Asc",
      title: "La direzione più autentica",
      teaser: "Al di là di quello che pensano gli altri, tu cosa pensi davvero?",
      eyebrow: "Nodo Nord in Sagittario, 12ª casa, congiunto all'Ascendente",
      phrase: "Voglio trovare la mia verità, non solo continuare a raccogliere quella degli altri.",
      bullets: [
              "Rende la costruzione di un'identità autentica uno dei grandi temi della sua vita",
              "l'autenticià attraverso qualità sagittarine di libertà, autonomia, ricerca personale e bisogno di un senso"
      ]
    }
  ];

  // ============================================
  // da qui in poi è la parte che fa funzionare tutto,
  // non serve modificarla
  // ============================================

  const menuPianeti = document.getElementById('menuPianeti');
  const menuAspetti = document.getElementById('menuAspetti');
  const cardSlot = document.getElementById('cardSlot');

  function riempiCarta(c){
    document.getElementById('frontGlyphs').textContent = c.glyph;
    document.getElementById('frontTitle').textContent = c.title;
    document.getElementById('frontTeaser').textContent = c.teaser;
    document.getElementById('backEyebrow').textContent = c.eyebrow;
    document.getElementById('backPhrase').textContent = '"' + c.phrase + '"';

    const lista = document.getElementById('backList');
    lista.innerHTML = '';
    c.bullets.forEach(function(testo){
      const li = document.createElement('li');
      li.textContent = testo;
      lista.appendChild(li);
    });

    cardSlot.classList.remove('flipped');
  }

  function aggiornaMenuAttivo(tipo, indice){
    document.querySelectorAll('#menuPianeti button').forEach(function(btn, i){
      btn.classList.toggle('active', tipo === 'pianeta' && i === indice);
    });
    document.querySelectorAll('#menuAspetti button').forEach(function(btn, i){
      btn.classList.toggle('active', tipo === 'aspetto' && i === indice);
    });
  }

  function mostraIntro(){
    riempiCarta(intro);
    aggiornaMenuAttivo(null, null);
  }

  // crea i pulsanti dei pianeti
  pianeti.forEach(function(c, i){
    const btn = document.createElement('button');
    btn.textContent = c.glyph;
    btn.addEventListener('click', function(){
      riempiCarta(c);
      aggiornaMenuAttivo('pianeta', i);
    });
    menuPianeti.appendChild(btn);
  });

  // crea i pulsanti degli aspetti
  aspetti.forEach(function(c, i){
    const btn = document.createElement('button');
    btn.textContent = c.glyph;
    btn.addEventListener('click', function(){
      riempiCarta(c);
      aggiornaMenuAttivo('aspetto', i);
    });
    menuAspetti.appendChild(btn);
  });

  // pulsante "torna alla copertina"
  document.getElementById('homeLink').addEventListener('click', mostraIntro);

  // il click sulla carta la fa girare
  cardSlot.addEventListener('click', function(){
    this.classList.toggle('flipped');
  });

  // mostra la copertina all'apertura della pagina
  mostraIntro();

</script>

</body>
</html>
